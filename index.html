<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM and Event Handling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header with the greeting message -->
    <h1 class="header" id="greeting">Hello</h1>

    <!-- Four colour boxes -->
    <div class="boxes">
        <div class="box">Red</div>
        <div class="box">Blue</div>
        <div class="box">Green</div>
        <div class="box">Yellow</div>
    </div>

    <!-- Name input and greet button -->
    <div class="greet-section">
        <input type="text" id="nameInput" placeholder="Enter your name">
        <button type="button" id="greetBtn">Greet</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
